<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="可逐层拆解、实时切换光通道和查看器件数量、价值量与厂商的NPO结构探索器"><meta name="theme-color" content="#143b62"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23143b62'/%3E%3Cpath d='M16 46V18l32 28V18' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E"><title>NPO结构探索器</title><style>/*STYLE*/</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">N</span><div><h1>NPO结构探索器</h1><span class="brand-caption">从光引擎到材料</span></div></div><nav class="tabs" aria-label="主导航"><button data-tab="structure" class="active">产品结构</button><button data-tab="bom">价值拆解</button><button data-tab="vendors">厂商图谱</button><button data-tab="sources">资料库</button></nav><div class="top-tools"><span id="data-date"></span><button class="icon-btn" id="export" title="导出当前数据库">导出数据 <span>↗</span></button></div></header>
<section class="configuration" aria-label="实时架构选择"><div class="control-group"><span class="control-label">总带宽</span><div class="segmented" id="rate-control"><button data-rate="3.2">3.2T</button><button data-rate="6.4">6.4T</button></div></div><div class="control-group lanes-group"><span class="control-label">光通道</span><div class="segmented" id="lane-control"></div></div><div class="control-group"><span class="control-label">光源位置</span><div class="segmented" id="laser-control"><button data-laser="external">外置ELS</button><button data-laser="board">板载光源</button></div></div><button class="settings-btn" id="settings">集成参数 <span>⌄</span></button></section>
<div class="route-ribbon"><div><span class="live-dot"></span><strong id="route-title"></strong><span id="route-note"></span></div><button id="route-detail">厂商路线 <span>↗</span></button></div>
<main id="structure-view" class="workspace">
<aside class="component-nav"><div class="nav-heading"><strong>部件导航</strong><span id="node-count"></span></div><label class="search"><span>⌕</span><input id="component-search" type="search" placeholder="搜索并定位器件、材料" aria-label="搜索器件"></label><div class="tree-caption">数量按当前NPO单元计算</div><div id="tree" role="tree"></div><div class="nav-foot"><span class="boundary-symbol"></span><p>ASIC仅作外部参照<br>不计入组件数量与BOM</p></div></aside>
<section class="product-stage"><div class="stage-head"><div id="breadcrumbs"></div><button class="back-button" id="back">← 返回上一级</button></div><div id="viewport"><div class="scene-loading">正在构建光互连结构</div></div><div class="stage-top-note"><span id="view-kicker">NPO / OPTICAL INTERCONNECT</span><h2 id="view-title">整体结构</h2><span id="view-subtitle"></span></div><div id="scene-tooltip"></div><div class="stage-controls"><button id="home-view" title="返回整体结构">⌂</button><span class="divider"></span><button id="zoom-in" title="放大">＋</button><button id="zoom-out" title="缩小">−</button><button id="reset-camera">复位</button><span class="divider"></span><label>展开 <input id="explode" type="range" min="0" max="1" step="0.01" value="0.32" aria-label="爆炸展开程度"></label><button id="capture" title="保存当前结构图">截图</button></div><div class="stage-legend"><span><i class="optical-line"></i>光路</span><span><i class="electrical-line"></i>电路</span><span>拖动旋转 · 滚轮缩放 · 单击进入</span></div><div id="child-strip" class="child-strip"></div><div id="change-toast" class="change-toast" role="status"></div></section>
<aside id="inspector" class="inspector"></aside>
</main>
<section id="data-view" class="data-view" hidden></section>
<footer class="statusbar"><span id="status-left"></span><span>通用结构示意 · 器件形态与相对位置不代表特定厂商实物</span></footer>
<dialog id="settings-dialog"><form method="dialog"><div class="dialog-header"><div><span class="eyebrow">LIVE CONFIGURATION</span><h2>集成与数量参数</h2></div><button class="close-btn" aria-label="关闭">×</button></div><p class="dialog-intro">调整后立即更新数量与模型，保留当前查看的部件</p><div id="settings-content" class="settings-grid"></div><div class="settings-note">各参数是通用结构假设，真实厂商可能集成或共享器件。400G光通道场景采用同速率电接口假设，尚非已确认NPO量产设计。</div><div class="dialog-actions"><button type="button" id="reset-settings">恢复默认参数</button><button class="primary">完成</button></div></form></dialog>
<dialog id="detail-dialog"><div class="dialog-header"><h2 id="detail-title"></h2><button id="close-detail" class="close-btn" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog>
<dialog id="price-dialog" aria-labelledby="price-title"><div class="dialog-header"><div><span class="eyebrow">PRICE EVIDENCE</span><h2 id="price-title"></h2></div><button id="close-price" class="close-btn" aria-label="关闭价格依据">×</button></div><div id="price-content"></div></dialog>
<noscript>此页面需要启用JavaScript以展示3D模型和实时数量计算</noscript>
<script>/*SCRIPT*/</script></body></html>
